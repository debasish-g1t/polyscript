name: Docs

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # Docs toolchain needs Python >= 3.11: on 3.10, pip caps mkdocstrings at
        # 1.0.6, which is incompatible with pymdown-extensions >= 12.2 (it does
        # not pass the now-required `md` argument to its Highlighter).
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[docs]
    - name: Build docs
      run: |
        mkdocs build
    - name: Deploy docs
      if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        mkdocs gh-deploy --force
