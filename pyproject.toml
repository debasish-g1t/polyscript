[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "polyscript-pypi"
version = "0.1.0"
description = "An optimized virtual polymerization framework that utilizes a custom polymer representation to induce better programmability for the chain formation."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "PolyScript Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "rdkit>=2023.03",
    "selfies>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=14.0",
    "fastparquet>=2023.10",
    "mpi4py>=3.1",
    "joblib>=1.3",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "rich>=13.0",

    "mcp>=1.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
test = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"polyscript.polymerizer.rules" = ["*.json", "*.pkl"]
